user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Лимит размера тела запроса (для загрузки фото)
  client_max_body_size 50M;

  # Security headers
  server_tokens off;

  map $sent_http_content_type $expires {
    default                    off;
    "~*text/html"              epoch;
    "~*text/css"               max;
    "~*application/javascript" max;
    "~*image/"                 max;
    "~*font/"                  max;
  }

  upstream backend {
    server antiquar-backend:3000;
  }

  server {
    listen 80;
    server_name tsehh.ru www.tsehh.ru;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
      return 301 https://tsehh.ru$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name tsehh.ru www.tsehh.ru;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3000 http://antiquar-backend:3000 ws: wss: https: http:; font-src 'self'; frame-ancestors 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }

    location ^~ /minio/ {
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;
      proxy_pass http://minio:9000/;
    }

    location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg|webp)$ {
      expires 30d;
      access_log off;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
