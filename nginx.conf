user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Лимит размера тела запроса (для загрузки фото)
  client_max_body_size 50M;

  # Security headers
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/ld+json
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2
    application/vnd.ms-fontobject
    application/x-font-ttf;

  upstream backend {
    server antiquar-backend:3000;
  }

  server {
    listen 80;
    server_name tsehh.ru www.tsehh.ru;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
      return 301 https://tsehh.ru$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name tsehh.ru www.tsehh.ru;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Note: locations that set add_header must repeat these (nginx inheritance).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3000 http://antiquar-backend:3000 ws: wss: https: http:; font-src 'self'; frame-ancestors 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://backend;

      # Private API responses must not be cached by browsers or intermediaries.
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      proxy_hide_header Pragma;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
      add_header Permissions-Policy "geolocation=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /minio/ {
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;
      proxy_pass http://minio:9000/;
    }

    # Hashed Vite assets and other static files (long cache).
    location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
      try_files $uri =404;
    }

    # Always revalidate the SPA shell so deploys pick up new hashed chunks.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer-when-downgrade" always;
      add_header Permissions-Policy "geolocation=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:3000 http://antiquar-backend:3000 ws: wss: https: http:; font-src 'self'; frame-ancestors 'self';" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
