version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: antiquar-db
    environment:
      POSTGRES_USER: antiquar
      POSTGRES_PASSWORD: antiquar123
      POSTGRES_DB: antiquar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antiquar-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://antiquar:antiquar123@postgres:5432/antiquar_db
      JWT_SECRET: your-secret-key-change-in-production
      CHOKIDAR_USEPOLLING: "true"  # Для NestJS watch в Docker на Windows
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: antiquar-products
      MINIO_USE_SSL: "false"
      # URL для доступа извне (frontend)
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        sleep 5 &&
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Generating Prisma client...' &&
        npx prisma generate &&
        echo 'Pushing database schema...' &&
        npx prisma db push --accept-data-loss || true &&
        echo 'Starting backend in watch mode...' &&
        npm run start:dev
      "
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antiquar-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true  # Для Vite watch в Docker на Windows
    depends_on:
      - backend
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: antiquar-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
