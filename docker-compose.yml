version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: antiquar-db
    environment:
      POSTGRES_USER: antiquar
      POSTGRES_PASSWORD: antiquar123
      POSTGRES_DB: antiquar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antiquar-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://antiquar:antiquar123@postgres:5432/antiquar_db
      CHOKIDAR_USEPOLLING: "true"  # Для NestJS watch в Docker на Windows
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        sleep 5 &&
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Generating Prisma client...' &&
        npx prisma generate &&
        echo 'Pushing database schema...' &&
        npx prisma db push --accept-data-loss || true &&
        echo 'Starting backend in watch mode...' &&
        npm run start:dev
      "
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antiquar-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true  # Для Vite watch в Docker на Windows
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
