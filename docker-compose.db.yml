version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - test_data:/var/lib/postgresql/data

volumes:
  test_data: